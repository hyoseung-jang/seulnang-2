# seulnang.co.kr 방문 분석 브리지 진입점.
# 배포 위치: ota-server:/root/ota-backend/nginx/conf.d/locations/seulnang.conf
# (ota_nginx 의 server 블록 안으로 include 된다 — callstats.conf 와 같은 방식.
#  왜 변수 업스트림 + rewrite 인지는 callstats.conf 의 주석 참고: 리터럴 이름을
#  쓰면 이 백엔드가 내려가 있을 때 nginx 전체가 기동에 실패한다.)

location /seulnang/ {
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $seulnang_upstream http://seulnang_analytics:3000;

    rewrite ^/seulnang(/.*)$ $1 break;
    proxy_pass $seulnang_upstream;

    client_max_body_size 1m;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
}
